spring.application.name=backend
server.port=${PORT:5000}
server.forward-headers-strategy=framework
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.datasource.url=${MSSQL_JDBC_URL:jdbc:sqlserver://HEYKAN;databaseName=DulceMielBD;integratedSecurity=true;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
app.cors.frontend-url=${FRONTEND_URL:}
logging.level.root=INFO
debug=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

app.jwt.secret=${JWT_SECRET:tu_clave_secreta_muy_segura_cambiar_en_produccion}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}
app.firebase.project-id=${FIREBASE_PROJECT_ID:}
app.firebase.credentials-file=${FIREBASE_CREDENTIALS_FILE:}
app.b2.endpoint=${B2_S3_ENDPOINT:}
app.b2.region=${B2_REGION:}
app.b2.bucket=${B2_BUCKET:}
app.b2.key-id=${B2_KEY_ID:}
app.b2.application-key=${B2_APPLICATION_KEY:}
app.b2.public-base-url=${B2_PUBLIC_BASE_URL:}
